<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<script>
// دیفالت پنل لایت‌مودـه؛ اگه قبلاً کاربر دارک‌مود رو انتخاب کرده بود، قبل از
// رنگ‌آمیزیِ صفحه (تا یه چشمک/فلش نداشته باشیم) همینجا روی <html> ست می‌شه.
(function () {
  try {
    if (localStorage.getItem("principal_theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) {}
})();
</script>
<title>پنل مدیر مدرسه — مسابقات شطرنج</title>
<link rel="manifest" href="/principal-manifest.webmanifest?k={{KEYQ}}">
<link rel="apple-touch-icon" href="/principal-icon.webp">
<meta name="theme-color" content="#a3121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/principal-assets/style.css?v={{V}}">
</head>
<body>

<!-- ── مجموعه‌آیکون‌ها (دو‌رنگه؛ همه با currentColor) ─────────────── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".16" d="M5.4 9.9 12 4.6l6.6 5.3V19a1.6 1.6 0 0 1-1.6 1.6H7A1.6 1.6 0 0 1 5.4 19z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 11 12 4l8.4 7"/><path d="M5.4 9.6V19A1.6 1.6 0 0 0 7 20.6h10a1.6 1.6 0 0 0 1.6-1.6V9.6"/><path d="M10 20.6v-4.4a2 2 0 0 1 4 0v4.4"/></g>
    </symbol>
    <symbol id="i-school" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".16" d="M5.4 20.6V10.6L12 6.6l6.6 4v10z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 20.6h16.8"/><path d="M5.4 20.6V10.6L12 6.6l6.6 4v10"/><path d="M12 6.6V3.4h3.2"/><path d="M9.8 20.6v-4a2.2 2.2 0 0 1 4.4 0v4"/><path d="M8 12.8h.01M16 12.8h.01" stroke-width="2.4"/></g>
    </symbol>
    <symbol id="i-pawn" viewBox="0 0 24 24">
      <circle fill="currentColor" fill-opacity=".16" cx="12" cy="6.6" r="2.8"/>
      <path fill="currentColor" fill-opacity=".16" d="M10.2 11.6h3.6c0 2.4.6 3.8 2.6 5.2H7.6c2-1.4 2.6-2.8 2.6-5.2z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6.6" r="2.8"/><path d="M9.5 11.6h5"/><path d="M10.2 11.6c0 2.4-.6 3.8-2.6 5.2h8.8c-2-1.4-2.6-2.8-2.6-5.2"/><path d="M7.4 16.8h9.2v3.6H7.4z"/></g>
    </symbol>
    <symbol id="i-board" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".16" d="M7.4 4H12v8H4V7.4A3.4 3.4 0 0 1 7.4 4zM12 12h8v4.6a3.4 3.4 0 0 1-3.4 3.4H12z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3.4"/><path d="M12 4v16M4 12h16"/></g>
    </symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".16" d="M7.5 4h9v4.2a4.5 4.5 0 0 1-9 0z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4h9v4.2a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 5.6H5.3A1.3 1.3 0 0 0 4 6.9c0 2 1.5 3.4 3.6 3.4M16.5 5.6h2.2A1.3 1.3 0 0 1 20 6.9c0 2-1.5 3.4-3.6 3.4"/><path d="M12 12.7v3.2"/><path d="M8.6 20h6.8M9.8 15.9h4.4V20"/></g>
    </symbol>
    <symbol id="i-guide" viewBox="0 0 24 24">
      <path fill="currentColor" stroke="currentColor" stroke-width=".5" stroke-linejoin="round" d="M5.98 3.00L7.90 7.75L9.24 11.45L4.17 6.94L5.55 8.95L7.26 11.54L9.67 15.32L11.17 17.78L11.22 13.31L13.61 15.41L18.70 20.07L19.83 21.00L18.23 18.05L14.52 11.51L11.63 6.19L11.50 10.19z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle fill="currentColor" fill-opacity=".16" cx="12" cy="12" r="3.8"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.8"/><path d="M12 3.2v2M12 18.8v2M3.2 12h2M18.8 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M18.2 5.8l-1.4 1.4M7.2 16.8l-1.4 1.4"/></g>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".16" d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".16" d="M6.2 16.4V11a5.8 5.8 0 0 1 11.6 0v5.4l1.6 1.8H4.6z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 16.4V11a5.8 5.8 0 0 1 11.6 0v5.4l1.6 1.8H4.6z"/><path d="M12 3.4v1.8"/><path d="M9.8 20.6a2.4 2.4 0 0 0 4.4 0"/></g>
    </symbol>
    <symbol id="i-check-all" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3.6 12.8l3.8 3.8L14 9.2M11 15.4l1.2 1.2L20.4 8.4"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.2"/><path d="M15.6 15.6 20 20"/></g>
    </symbol>
    <symbol id="i-trend" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8 17l5.2-5.2 3.6 3.6L20 8"/><path d="M15 8h5v5"/></g>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9.5l6 6 6-6"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".2" d="M20 4 10.5 13.5l.6 6.5 3-5.4z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 4 10.5 13.5M20 4l-6 16-3.5-6.5L4 10z"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8L12 16.9l-5.2 2.75 1-5.8-4.2-4.1 5.8-.85z"/>
    </symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24">
      <path fill="currentColor" d="M13.4 2.6 5.2 13.6h5.5l-1.1 7.8 8.4-11.6h-5.6z"/>
    </symbol>
    <symbol id="i-crown" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".2" d="M5.9 18.2 4.5 8.6l3.8 3.2L12 6l3.7 5.8 3.8-3.2-1.4 9.6z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.9 18.2 4.5 8.6l3.8 3.2L12 6l3.7 5.8 3.8-3.2-1.4 9.6z"/><path d="M6.6 21h10.8"/></g>
    </symbol>
    <symbol id="i-flag" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".16" d="M6 5h11l-2.4 3.6L17 12H6z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4.2"/><path d="M6 5h11l-2.4 3.6L17 12H6"/></g>
    </symbol>
    <symbol id="i-cal-week" viewBox="0 0 24 24">
      <rect fill="currentColor" fill-opacity=".14" x="4" y="5.4" width="16" height="14.8" rx="3"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.4" width="16" height="14.8" rx="3"/><path d="M4 10h16M8.4 3.6v3.2M15.6 3.6v3.2"/><path d="M8 14.4h8" stroke-width="2.6"/></g>
    </symbol>
    <symbol id="i-cal-month" viewBox="0 0 24 24">
      <rect fill="currentColor" fill-opacity=".14" x="4" y="5.4" width="16" height="14.8" rx="3"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.4" width="16" height="14.8" rx="3"/><path d="M4 10h16M8.4 3.6v3.2M15.6 3.6v3.2"/><path d="M8 13.4h.01M12 13.4h.01M16 13.4h.01M8 16.9h.01M12 16.9h.01" stroke-width="2.4"/></g>
    </symbol>
    <symbol id="i-layers" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity=".16" d="M12 4l8.5 4.5L12 13 3.5 8.5z"/>
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5 12 17l8.5-4.5"/><path d="M3.5 16.5 12 21l8.5-4.5"/></g>
    </symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3.5 12.5h4l2.4-6.2 4.2 12 2.4-5.8h4"/>
    </symbol>
    <symbol id="i-infinity" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 12c2-2.6 3.4-4 5.4-4a4 4 0 0 1 0 8c-2 0-3.4-1.4-5.4-4zm0 0c-2-2.6-3.4-4-5.4-4a4 4 0 0 0 0 8c2 0 3.4-1.4 5.4-4z"/>
    </symbol>
    <symbol id="i-empty" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3.4"/><path d="M8.5 14.5c1-1.5 2.2-2.2 3.5-2.2s2.5.7 3.5 2.2"/><path d="M9 9.6h.01M15 9.6h.01" stroke-width="2.2"/></g>
    </symbol>
  </defs>
</svg>

<!-- ── اسپلش خوش‌آمدگویی ──────────────────────────────────── -->
<div id="splash" class="splash">
  <div class="splash-rings" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="splash-content">
    <span class="logo" role="img" aria-label="لوگوی پروژه"></span>
    <h1 class="splash-title">پنل مدیر مدرسه</h1>
    <p class="splash-sub">خوش آمدید</p>
    <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="app" class="app-veil">
  <main class="page">

    <!-- نوار ابزار کوچک: ساعت + سوییچ حالت نمایش (آیکونِ کوچک در گوشه) -->
    <div class="util">
      <div id="topbar-clock" class="clock" aria-hidden="true">--:--:--</div>
      <div class="util-actions">
        <button id="bell-btn" class="icon-btn" type="button" aria-label="اعلانات" aria-haspopup="dialog" aria-expanded="false" aria-controls="nt">
          <svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg>
          <span id="bell-badge" class="bell-badge" hidden aria-hidden="true">0</span>
        </button>
        <button id="theme-btn" class="icon-btn" type="button" aria-label="تغییر حالت نمایش (روشن یا تیره)" aria-pressed="false">
          <svg class="ic ic-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          <svg class="ic ic-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
      </div>
    </div>

    <!-- سربرگِ خانه: آیکونِ پروژه + خوش‌آمدگوییِ متناسب با ساعت -->
    <section id="hero" class="hero">
      <span class="logo" role="img" aria-label="لوگوی پروژه"></span>
      <h1 id="greeting">خوش آمدید</h1>
      <p id="today-date"></p>
    </section>

    <!-- سربرگِ بقیهٔ صفحه‌ها -->
    <div id="page-head" class="page-head" hidden>
      <h2 id="view-title"></h2>
      <button id="topbar-trends-btn" class="trend-cap" type="button" aria-expanded="false" aria-controls="trends-panel" hidden>
        <span class="trend-ring" aria-hidden="true"></span>
        <svg class="ic" aria-hidden="true"><use href="#i-trend"/></svg>
        <span>مشاهده روندها</span>
        <svg class="ic chev" aria-hidden="true"><use href="#i-chevron"/></svg>
      </button>
    </div>

    <div id="view-body" class="view-body" aria-live="polite"></div>

    <!-- امضای امنیتی: «Secured by CSF» (Chess Security Force) — ریز، وسطِ پایینِ هر بخش -->
    <footer class="secured-by" dir="ltr" title="Chess Security Force" aria-label="Secured by Chess Security Force">
      <span class="logo sb-logo" aria-hidden="true"></span>
      <span class="sb-text">Secured by <b>CSF</b></span>
    </footer>
  </main>
</div>

<!-- ── کپسولِ ناوبری (بیرون از #app تا همیشه نسبت به کل صفحه فیکس بمونه) ── -->
<nav id="dock" class="dock" aria-label="منوی اصلی" style="--i:0">
  <div class="dock-brand" aria-hidden="true">
    <span class="logo"></span>
    <b>پنل مدیر مدرسه</b>
    <small>مسابقات شطرنج</small>
  </div>
  <span class="dock-thumb" aria-hidden="true"></span>
  <button class="dock-item is-on" type="button" data-view="home" aria-current="page">
    <svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>خانه</span>
  </button>
  <button class="dock-item" type="button" data-view="classes">
    <svg class="ic" aria-hidden="true"><use href="#i-school"/></svg><span>کلاس‌ها</span>
  </button>
  <button class="dock-item" type="button" data-view="players">
    <svg class="ic" aria-hidden="true"><use href="#i-pawn"/></svg><span>بازیکن‌ها</span>
  </button>
  <button class="dock-item" type="button" data-view="matches">
    <svg class="ic" aria-hidden="true"><use href="#i-board"/></svg><span>مسابقات</span>
  </button>
  <button class="dock-item" type="button" data-view="top">
    <svg class="ic" aria-hidden="true"><use href="#i-trophy"/></svg><span>برترین‌ها</span>
  </button>
</nav>

<!-- ── رهگشا: آیکونِ مجزا بالای کپسول، در همهٔ صفحه‌ها در دسترس ── -->
<button id="rg-fab" class="fab" type="button" aria-label="باز کردن رهگشا، دستیار هوشمند" aria-expanded="false" aria-controls="rg">
  <svg class="ic" aria-hidden="true"><use href="#i-guide"/></svg>
</button>

<div id="rg" class="rg" aria-hidden="true">
  <div class="rg-backdrop" data-close></div>
  <section class="rg-panel" role="dialog" aria-modal="true" aria-labelledby="rg-title">
    <header class="rg-head">
      <span class="seal"><svg class="ic" aria-hidden="true"><use href="#i-guide"/></svg></span>
      <div class="rg-head-txt">
        <h3 id="rg-title">رهگشا</h3>
        <p>دستیار هوشمند LUX؛ راهنمای شما دربارهٔ وضعیت و بخش‌های همین پنل</p>
      </div>
      <button class="icon-btn" type="button" data-close aria-label="بستن رهگشا"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>
    <div id="assistant-log" class="rg-log"></div>
    <div id="assistant-suggestions" class="rg-sugg"></div>
    <form id="assistant-form" class="rg-form" autocomplete="off">
      <input type="text" id="assistant-input" placeholder="سوالتان را بنویسید…" autocomplete="off" enterkeyhint="send">
      <button type="submit" id="assistant-send" class="rg-send" aria-label="ارسال"><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
    </form>
  </section>
</div>

<!-- ── اعلانات: با زنگولهٔ بالای صفحه باز می‌شود ─────────────── -->
<div id="nt" class="nt" aria-hidden="true">
  <div class="nt-backdrop" data-nt-close></div>
  <section class="nt-panel" role="dialog" aria-modal="true" aria-labelledby="nt-title">
    <header class="nt-head">
      <span class="seal"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg></span>
      <div class="nt-head-txt">
        <h3 id="nt-title">اعلانات</h3>
        <p id="nt-sub">در حال بارگذاری…</p>
      </div>
      <button id="nt-readall" class="icon-btn" type="button" aria-label="علامت‌گذاری همه به‌عنوان خوانده‌شده" title="همه را خوانده‌شده کن"><svg class="ic" aria-hidden="true"><use href="#i-check-all"/></svg></button>
      <button class="icon-btn" type="button" data-nt-close aria-label="بستن اعلانات"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>

    <div id="nt-banner" class="nt-banner" hidden></div>

    <div class="nt-tools">
      <div class="search nt-search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="nt-search" type="search" placeholder="جستجو در عنوان، متن و تاریخ اعلان‌ها…" autocomplete="off" enterkeyhint="search" aria-label="جستجو در اعلانات">
      </div>
      <div id="nt-status" class="nt-seg" role="group" aria-label="وضعیت خوانده‌شدن">
        <button type="button" data-status="all" class="is-on">همه</button>
        <button type="button" data-status="unread">خوانده‌نشده</button>
        <button type="button" data-status="read">خوانده‌شده</button>
      </div>
      <div id="nt-period" class="nt-chips" role="group" aria-label="بازهٔ زمانی"></div>
    </div>

    <div class="nt-meta">
      <span id="nt-count" aria-live="polite"></span>
      <button id="nt-sort" class="nt-sort" type="button" data-order="new">جدیدترین اول</button>
    </div>
    <div id="nt-list" class="nt-list"></div>
  </section>

  <!-- ── نمایِ تمام‌صفحهٔ یک اعلان ────────────────────────── -->
  <div id="nt-detail" class="nt-detail" aria-hidden="true">
    <div class="nt-detail-inner">
      <header class="nt-detail-head">
        <button class="icon-btn" type="button" id="nt-detail-close" aria-label="بستن"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
        <span id="nt-detail-time" class="nt-detail-time"></span>
      </header>
      <div class="nt-detail-scroll">
        <h2 id="nt-detail-title" class="nt-detail-title"></h2>
        <p id="nt-detail-text" class="nt-detail-text"></p>
      </div>
      <div class="nt-detail-actions">
        <button type="button" id="nt-detail-toggle"></button>
      </div>
    </div>
  </div>
</div>

<script>window.PRINCIPAL_KEY = "{{KEY}}";</script>
<script src="/principal-assets/app.js?v={{V}}"></script>
<script src="/principal-assets/notifications.js?v={{V}}"></script>
</body>
</html>
